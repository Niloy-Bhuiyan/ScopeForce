[project]
name = "scopeforce-ai"
version = "0.1.0"
description = "Grounded project context intelligence for ScopeForce"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "langchain==1.3.17",
  "langchain-openai==1.6.0",
  "langchain-text-splitters==1.1.2",
  "pydantic==2.12.5",
  "uvicorn==0.41.0"
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai", "api"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
